[package]
name = "wisent-evaluators-release"
edition = "2021"
description = "The release contract of the wisent-evaluators Python package: the evaluator names it registers and the baseline PyPI serves"
license = "MIT"
publish = false

[[bin]]
name = "wisent-evaluators-release"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde_json = "1"
tar = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
