name: Publish to PyPI
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Refuse a release whose tag disagrees with the manifest
        # A PyPI version is immutable: once a distribution is uploaded, that number can
        # never be overwritten, renamed or reused. So a Release named v1.2.3 that ships a
        # tree declaring something else is a mistake with no repair afterwards — only
        # prose in the release notes. brama learned this the expensive way: v0.2.9 through
        # v0.2.13 were cut from trees already declaring 0.3.0, and five releases published
        # a breaking change under patch-looking names. This refuses before `python -m
        # build` produces the first byte anybody could upload, which is the last moment
        # where the mistake costs nothing but a retag.
        #
        # The version is read in the one spelling this repository already uses for it —
        # the same awk over setup.py that .github/workflows/version-check.yml reads
        # `declared` with. scripts/baseline.py is deliberately NOT asked: it refuses to
        # look at setup.py's version at all (its docstring says so), because a bump ahead
        # of a release would 404 and it would measure the working tree. setup.py IS the
        # manifest here — pyproject.toml carries only [build-system] and [tool.ruff], with
        # no [project] table — so there is no other declaration to disagree with it.
        #
        # The coordinate comes from github.event.release.tag_name: on a `release` trigger
        # that is the tag the Release actually carries, and it is the thing PyPI's upload
        # will be remembered by, not GITHUB_REF_NAME. It arrives through env rather than
        # being interpolated into the script body, because a tag name is text somebody
        # else chose.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          declared="$(awk -F'"' '/version=/{print $2; exit}' setup.py)"
          # An empty read must never reach the comparison: it would make the expectation
          # itself empty, and a tag named `v` — or, on the tolerant shape below, an empty
          # tag — would satisfy it. That is the one way this gate could wave through
          # exactly what it exists to catch.
          test -n "$declared" || {
            echo "::error::setup.py yielded no version, so there is nothing to compare the" \
              "release tag against. Refusing rather than publishing an unchecked coordinate."
            false
          }

          # One optional leading `v`, and the numbers must agree. Measured, not assumed:
          # `gh release list` names no release and `git ls-remote --tags origin` lists no
          # tag, so this repository has never cut one and no naming shape has been
          # observed to demand. The sibling wisent-extractors is strict about `v` because
          # nine of its nine releases carry it; inventing that policy here would refuse a
          # first release for a prefix nobody has chosen yet, while the number — the part
          # PyPI freezes — is checked either way. What revokes this: the first release
          # landing, after which this should demand that release's exact shape.
          if [ "${RELEASE_TAG#v}" != "$declared" ]; then
            echo "::error::release tag $RELEASE_TAG does not name $declared, the version" \
              "setup.py declares. Publishing now would put a distribution containing" \
              "$declared on PyPI under the release $RELEASE_TAG. A PyPI version is" \
              "immutable — it cannot be overwritten, renamed or reused once uploaded — so" \
              "this is the last moment at which the mistake is free. Either the tag names a" \
              "version this tree does not contain, or the bump was never committed."
            false
          fi
          echo "release tag $RELEASE_TAG matches the $declared that setup.py declares."

      - name: Build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # `python -m build` ADDS to dist/ and never clears it, and the publish step below
          # uploads whatever the directory holds — so any leftover is published as though
          # this run had built it, under this release's name, immutably. A GitHub-hosted
          # runner starts on an empty workspace and actions/checkout runs `git clean -ffdx`
          # (which reaches dist/ even though .gitignore lists it), so today nothing is
          # left; neither of those is a property of this workflow, and the fleet already
          # runs self-hosted runners that reuse a workspace. One line makes it a property
          # of this workflow.
          rm -rf dist
          python -m pip install --upgrade pip build
          python -m build
          # And what gets uploaded must be what the gate above vouched for. The number is
          # taken from the tag, not carried over from the step that read the manifest, so
          # no single wrong value can satisfy both comparisons; the check sits in the step
          # that produced the files rather than in one that could later be reordered or
          # made conditional away from them.
          version="${RELEASE_TAG#v}"
          test -n "$(ls -A dist)" || {
            echo "::error::python -m build produced no distributions, so the publish step" \
              "would upload nothing while reporting success."
            false
          }
          ls dist
          for built in dist/*; do
            case "${built##*/}" in
              *"$version"*) ;;
              *)
                echo "::error::dist/ holds ${built##*/}, whose name does not carry" \
                  "$version. The publish step uploads the whole directory, so this file" \
                  "would reach PyPI as part of $RELEASE_TAG."
                false ;;
            esac
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
