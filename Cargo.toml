[package]
name = "wisent-evaluators"
version = "0.2.0"
edition = "2021"
description = "Benchmark evaluators: score a model's answer against a benchmark's expected answer, and the release contract of the evaluator names"
license = "MIT"
repository = "https://github.com/wisent-ai/wisent-evaluators"
publish = false

[lib]
name = "wisent_evaluators"
path = "src/lib.rs"

[[bin]]
name = "wisent-evaluators"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
regex = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
flate2 = "1"
serde_json = "1"
tar = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
# Each PyPI request the release reader makes says on stderr what it waits for.
stado-wait = { git = "https://github.com/wisent-ai/stado", rev = "49375f3a10e375800c841bc3cb1d1036727350a3" }
ureq = "2"
unicode-normalization = "0.1.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
